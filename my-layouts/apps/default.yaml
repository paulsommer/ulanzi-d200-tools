brightness: 100
label_style:
  Align: bottom
  Color: 16777215
  FontName: Roboto
  ShowTitle: false
  Size: 10
  Weight: 80
obs:
  host: localhost
  port: 4444
  password: null
buttons:

# 0: KeePassXC
- image: ./icons/keepassxc.png
  d200_icon:
    source: /usr/share/icons/hicolor/scalable/apps/keepassxc.svg
    text: KeePassXC
  icon_source: ./icons/keepassxc.png
  icon_scale: 100
  content_margin: 0
  label: KeePassXC
  action: command
  params:
    cmd: ~/.local/bin/d200-raise keepassxc  ### <--- change this to your path (where d200-raise is linked)

