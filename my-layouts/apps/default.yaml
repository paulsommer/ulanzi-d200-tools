brightness: 100
label_style:
  Align: bottom
  Color: 16777215
  FontName: Roboto
  ShowTitle: false
  Size: 10
  Weight: 80
obs:
  host: localhost
  port: 4444
  password: null
buttons:

# 0: Firefox
- image: ./icons/firefox.png
  icon_source: ./icons/firefox.png
  icon_scale: 100
  content_margin: 0
  label: Firefox
  action: command
  params:
    cmd: ~/.local/bin/d200-raise firefox  ### <--- change this to your path (where d200-raise is linked)

