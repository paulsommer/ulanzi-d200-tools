# GIMP layout (window class gimp), icons from the Legacy theme
# (undo, redo and select none from Default, Legacy has none)
#   row 1:  Undo | Redo | Fit image in window | prev track | next track
#   row 2:  Rect select | Select none | Move | Crop | play/pause
#   row 3:  Paintbrush | Eraser | Text
brightness: 100
label_style:
  Align: bottom
  Color: 16777215
  FontName: Roboto
  ShowTitle: false
  Size: 10
  Weight: 80
obs:
  host: localhost
  port: 4444
  password: null
buttons:

# 0: Undo (d200-key uses scancodes: US "y" is the German Z key)
- image: ./icons/gimp-undo.png
  icon_source: ./icons/gimp-undo.png
  icon_scale: 100
  content_margin: 0
  label: Ctrl+Z
  action: command
  params:
    cmd: ~/.local/bin/d200-key ctrl+y  ### <--- change this to your path (where d200-key is linked)

# 1: Redo (US "z" = German Y key)
- image: ./icons/gimp-redo.png
  icon_source: ./icons/gimp-redo.png
  icon_scale: 100
  content_margin: 0
  label: Ctrl+Y
  action: command
  params:
    cmd: ~/.local/bin/d200-key ctrl+z  ### <--- change this to your path (where d200-key is linked)

# 2: Fit image in window
- image: ./icons/gimp-zoom-fit.png
  icon_source: ./icons/gimp-zoom-fit.png
  icon_scale: 100
  content_margin: 0
  label: Shift+Ctrl+J
  action: command
  params:
    cmd: ~/.local/bin/d200-key shift+ctrl+j  ### <--- change this to your path (where d200-key is linked)

# 3: previous track
- image: ./icons/media-previous.png
  icon_source: ./icons/media-previous.png
  icon_scale: 100
  content_margin: 0
  label: ''
  action: command
  params:
