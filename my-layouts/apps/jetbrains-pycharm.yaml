# PyCharm layout (window class jetbrains-pycharm)
#   row 1:  Find usages | Goto implementation | Search everywhere | prev track | next track
#   row 2:  Debug | Step over | Step into my code | Step out | play/pause
#   row 3:  Back | Forward | Resume program
brightness: 100
label_style:
  Align: bottom
  Color: 16777215
  FontName: Roboto
  ShowTitle: false
  Size: 10
  Weight: 80
obs:
  host: localhost
  port: 4444
  password: null
buttons:

# 0: Find usages
- image: ./icons/pycharm-usages.png
  d200_icon:
    source: ~/apps/pycharm/lib/app-client.jar!actions/findEntireFile_dark.svg  ### <--- change this to your path (your installation)
    text: Find Usages
  icon_source: ./icons/pycharm-usages.png
  icon_scale: 100
  content_margin: 0
  label: Shift+Alt+7
  action: command
  params:
    cmd: ~/.local/bin/d200-key shift+alt+7  ### <--- change this to your path (where d200-key is linked)

# 1: Go to implementation(s)
- image: ./icons/pycharm-impl.png
  d200_icon:
    source: ~/apps/pycharm/lib/app-client.jar!expui/gutter/implementedMethod_dark.svg  ### <--- change this to your path (your installation)
    text: Go to Impl.
  icon_source: ./icons/pycharm-impl.png
  icon_scale: 100
  content_margin: 0
  label: Ctrl+Alt+B
  action: command
  params:
    cmd: ~/.local/bin/d200-key ctrl+alt+b  ### <--- change this to your path (where d200-key is linked)

# 2: Search everywhere (double Shift)
- image: ./icons/pycharm-search.png
  d200_icon:
    source: ~/apps/pycharm/lib/app-client.jar!expui/general/search_dark.svg  ### <--- change this to your path (your installation)
    text: Search
  icon_source: ./icons/pycharm-search.png
  icon_scale: 100
  content_margin: 0
  label: Shift Shift
  action: command
  params:
    cmd: ~/.local/bin/d200-key shift && ~/.local/bin/d200-key shift  ### <--- change this to your path (where d200-key is linked)

# 3: previous track
- image: ./icons/media-previous.png
  icon_source: ./icons/media-previous.png
  icon_scale: 100
  content_margin: 0
  label: ''
  action: command
  params:
    cmd: ~/.local/bin/d200-key previoussong  ### <--- change this to your path (where d200-key is linked)

# 4: next track
- image: ./icons/media-next.png
  icon_source: ./icons/media-next.png
  icon_scale: 100
  content_margin: 0
  label: ''
  action: command
  params:
    cmd: ~/.local/bin/d200-key nextsong  ### <--- change this to your path (where d200-key is linked)

# 5: Debug
- image: ./icons/pycharm-debug.png
  d200_icon:
    source: ~/apps/pycharm/lib/app-client.jar!expui/run/debug_dark.svg  ### <--- change this to your path (your installation)
    text: Debug
  icon_source: ./icons/pycharm-debug.png
  icon_scale: 100
  content_margin: 0
  label: Shift+F9
  action: command
  params:
    cmd: ~/.local/bin/d200-key shift+f9  ### <--- change this to your path (where d200-key is linked)

# 6: Step over
- image: ./icons/pycharm-step-over.png
  d200_icon:
    source: ~/apps/pycharm/lib/app-client.jar!expui/run/stepOver_dark.svg  ### <--- change this to your path (your installation)
    text: Step Over
  icon_source: ./icons/pycharm-step-over.png
  icon_scale: 100
  content_margin: 0
  label: F8
  action: command
  params:
    cmd: ~/.local/bin/d200-key f8  ### <--- change this to your path (where d200-key is linked)

# 7: Step into my code
- image: ./icons/pycharm-step-into.png
  d200_icon:
    source: ./svg/pycharm-step-into-my-code.svg
    text: Step Into|My Code
  icon_source: ./icons/pycharm-step-into.png
  icon_scale: 100
  content_margin: 0
  label: Alt+Shift+F7
  action: command
  params:
    cmd: ~/.local/bin/d200-key alt+shift+f7  ### <--- change this to your path (where d200-key is linked)

# 8: Step out
- image: ./icons/pycharm-step-out.png
  d200_icon:
    source: ~/apps/pycharm/lib/app-client.jar!expui/run/stepOut_dark.svg  ### <--- change this to your path (your installation)
    text: Step Out
  icon_source: ./icons/pycharm-step-out.png
  icon_scale: 100
  content_margin: 0
  label: Shift+F8
  action: command
  params:
    cmd: ~/.local/bin/d200-key shift+f8  ### <--- change this to your path (where d200-key is linked)

# 9: play/pause
- image: ./icons/media-playpause.png
  icon_source: ./icons/media-playpause.png
  icon_scale: 100
  content_margin: 0
  label: ''
  action: command
  params:
    cmd: ~/.local/bin/d200-key playpause  ### <--- change this to your path (where d200-key is linked)

# 10: Back
- image: ./icons/pycharm-back.png
  d200_icon:
    source: ~/apps/pycharm/lib/app-client.jar!expui/general/left_dark.svg  ### <--- change this to your path (your installation)
    text: Back
  icon_source: ./icons/pycharm-back.png
  icon_scale: 100
  content_margin: 0
  label: Ctrl+Alt+Left
  action: command
  params:
    cmd: ~/.local/bin/d200-key ctrl+alt+left  ### <--- change this to your path (where d200-key is linked)

# 11: Forward
- image: ./icons/pycharm-forward.png
  d200_icon:
    source: ~/apps/pycharm/lib/app-client.jar!expui/general/right_dark.svg  ### <--- change this to your path (your installation)
    text: Forward
  icon_source: ./icons/pycharm-forward.png
  icon_scale: 100
  content_margin: 0
  label: Ctrl+Alt+Right
  action: command
  params:
    cmd: ~/.local/bin/d200-key ctrl+alt+right  ### <--- change this to your path (where d200-key is linked)

# 12: Resume program
- image: ./icons/pycharm-resume.png
  d200_icon:
    source: ~/apps/pycharm/lib/app-client.jar!expui/run/resume_dark.svg  ### <--- change this to your path (your installation)
    text: Resume
  icon_source: ./icons/pycharm-resume.png
  icon_scale: 100
  content_margin: 0
  label: F9
  action: command
  params:
    cmd: ~/.local/bin/d200-key f9  ### <--- change this to your path (where d200-key is linked)

# 13:
- null
background: null
