<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- D200 layout editor: device with 2x5 + 3 keys and the wide display, one key selected, pencil -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b737b"/>
      <stop offset="1" stop-color="#454b51"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4046"/>
      <stop offset="1" stop-color="#2a2f34"/>
    </linearGradient>
    <linearGradient id="wide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc4ff"/>
      <stop offset="1" stop-color="#b294f0"/>
    </linearGradient>
  </defs>

  <!-- device -->
  <rect x="14" y="52" width="228" height="150" rx="22" fill="url(#body)" stroke="#2a2e32" stroke-width="2.5"/>

  <!-- keys: 32 px, gap 9 px, rows at y = 66, 107, 148 -->
  <g fill="url(#key)" stroke="#9aa3ab" stroke-width="1.5">
    <rect x="30"  y="66"  width="32" height="32" rx="6"/>
    <rect x="71"  y="66"  width="32" height="32" rx="6"/>
    <rect x="153" y="66"  width="32" height="32" rx="6"/>
    <rect x="194" y="66"  width="32" height="32" rx="6"/>
    <rect x="30"  y="107" width="32" height="32" rx="6"/>
    <rect x="71"  y="107" width="32" height="32" rx="6"/>
    <rect x="112" y="107" width="32" height="32" rx="6"/>
    <rect x="153" y="107" width="32" height="32" rx="6"/>
    <rect x="194" y="107" width="32" height="32" rx="6"/>
    <rect x="30"  y="148" width="32" height="32" rx="6"/>
    <rect x="71"  y="148" width="32" height="32" rx="6"/>
    <rect x="112" y="148" width="32" height="32" rx="6"/>
  </g>
  <!-- selected key -->
  <rect x="112" y="66" width="32" height="32" rx="6" fill="url(#key)" stroke="#5fd0ff" stroke-width="3.5"/>
  <!-- wide display -->
  <rect x="153" y="148" width="73" height="32" rx="6" fill="url(#wide)" stroke="#9aa3ab" stroke-width="1.5"/>

  <!-- key symbols -->
  <circle cx="46" cy="82" r="9" fill="#ffa53d"/>
  <path d="M80 75 l8 7 l-8 7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="119" y="75" width="18" height="14" rx="2" fill="#5fd0ff"/>
  <path d="M160 82 l8 -6 v12 z M168 82 l8 -6 v12 z" fill="#ffffff"/>
  <path d="M201 76 v12 M206 76 v12" stroke="#ffffff" stroke-width="3"/>
  <path d="M213 76 l7 6 l-7 6 z" fill="#ffffff"/>
  <circle cx="46" cy="123" r="9" fill="#4dc3ff"/>
  <circle cx="87" cy="123" r="9" fill="#4fdc8f"/>
  <path d="M128 114 l9 9 l-9 9 l-9 -9 z" fill="#ffd36b"/>
  <rect x="81" y="157" width="12" height="15" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="122" y="157" width="12" height="15" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- pencil -->
  <g transform="translate(184 214) rotate(-45)">
    <rect x="-6" y="-14" width="70" height="28" rx="3" fill="#ffd36b" stroke="#2a2e32" stroke-width="3"/>
    <rect x="44" y="-14" width="20" height="28" rx="3" fill="#f2697a" stroke="#2a2e32" stroke-width="3"/>
    <rect x="38" y="-14" width="8" height="28" fill="#d5dadf" stroke="#2a2e32" stroke-width="3"/>
    <path d="M-6 -14 L-30 0 L-6 14 Z" fill="#f8e3c2" stroke="#2a2e32" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-20 -6 L-30 0 L-20 6 Z" fill="#2a2e32"/>
  </g>
</svg>
