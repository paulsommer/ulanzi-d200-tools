# d200-focus restarts the daemon on every layout switch; without this,
# systemd blocks the unit after 5 restarts within 10 seconds.
[Unit]
StartLimitIntervalSec=0

[Service]
# A SIGTERM during the daemon's internal re-configuration after plug-in gets lost
# (upstream race); kill it quickly instead of waiting the default 90 s.
TimeoutStopSec=2
